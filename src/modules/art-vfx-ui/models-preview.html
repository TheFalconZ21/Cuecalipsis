<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuecalipsis · Modelos Dev 4</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #eee2ca; background: #1b1e1d; font: 13px "Avenir Next", Avenir, sans-serif; }
      main { display: grid; grid-template-columns: minmax(190px, 260px) 1fr; min-height: 100vh; }
      aside { padding: 28px 18px; border-right: 1px solid #c8ad7540; background: #171a19; }
      h1 { margin: 0; color: #e0bf7d; font: 23px Georgia, serif; }
      aside p { margin: 8px 0 24px; color: #9d988a; font: italic 13px Georgia, serif; }
      nav { display: grid; gap: 7px; }
      button { padding: 11px 12px; border: 1px solid #c8ad7540; background: #202422; color: #e8dfcc; text-align: left; font: inherit; cursor: pointer; }
      button:hover, button[aria-pressed="true"] { border-color: #d7b56f; background: #38352b; color: #f1d497; }
      #model-name { position: absolute; left: 26px; top: 22px; z-index: 1; margin: 0; color: #e4c784; font: 18px Georgia, serif; pointer-events: none; }
      #stage { position: relative; min-height: 100vh; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #41433b 0, #292d2a 48%, #1b1e1d 100%); }
      canvas { display: block; width: 100%; height: 100%; }
      @media (max-width: 650px) { main { grid-template-columns: 1fr; grid-template-rows: auto minmax(58vh, 1fr); } aside { padding: 16px; border-right: 0; border-bottom: 1px solid #c8ad7540; } nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } #stage { min-height: 58vh; } }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>Elenco de la plaza</h1>
        <p>Low-poly para leerse desde arriba.</p>
        <nav id="model-list" aria-label="Modelos"></nav>
      </aside>
      <section id="stage" aria-label="Vista de modelos"><h2 id="model-name"></h2></section>
    </main>
    <script type="module" src="./models-preview.ts"></script>
  </body>
</html>
