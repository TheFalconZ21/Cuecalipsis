<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17120f" />
    <title>Cuecalipsis · Flujo de partida</title>
    <style>
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 38%, #4a3d30, #201c18 62%, #151310); color: #f0e4cd; font: 13px 'SFMono-Regular',Consolas,monospace; }
      .preview { min-height: 100vh; padding: 22px; }.preview header { max-width: 900px; margin: 0 auto 12px; }.preview header p { color: #c3a568; font-size: 9px; letter-spacing: .17em; }.preview h2 { margin: 4px 0; font: 30px Georgia,serif; }.stage { position: relative; width: min(1120px,100%); height: min(680px,calc(100vh - 185px)); min-height: 400px; margin: auto; border: 1px solid #b59a654c; background: radial-gradient(ellipse at center,#67584028,transparent 45%), #24242170; box-shadow: 0 20px 80px #0007; }.stage::before { position: absolute; inset: 0; content: ''; opacity: .25; background: repeating-linear-gradient(0deg,transparent 0 56px,#ccb67710 57px), repeating-linear-gradient(90deg,transparent 0 56px,#ccb67710 57px); pointer-events: none; }.toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; max-width: 900px; margin: 12px auto; }.toolbar button { padding: 8px 11px; border: 1px solid #c3a5685b; background: #1a1a17; color: #ede2cd; font: inherit; font-size: 9px; cursor: pointer; }.toolbar button:hover { border-color: #e6c375; background: #3b3021; }.preview .note { max-width: 900px; margin: 0 auto; color: #9f9583; font: italic 12px Georgia,serif; }
      #flow-root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <main class="preview">
      <header><p>DEV 4 · FLUJO DE PARTIDA</p><h2>La rueda no se detiene.</h2></header>
      <section class="stage" aria-label="Vista de prueba de pantallas">
        <div id="flow-root"></div>
      </section>
      <nav class="toolbar" aria-label="Simulación de estados">
        <button id="levelup">Subir de nivel</button><button id="confirm-upgrade" hidden>Confirmar mejora</button>
        <button id="victory">Victoria</button><button id="defeat">Derrota</button><button id="menu">Portada</button>
      </nav>
      <p class="note" id="status">Elige un huaso, cruza los modales y revisa el cierre de la partida.</p>
    </main>
    <script type="module" src="./game-flow-preview.ts"></script>
  </body>
</html>
